# Meizu M6 (MT6750) GNSS assistance config.
# The shipped gps.conf was empty -> no NTP time injection (mnld GET_RTC_FAIL)
# and no SUPL/AGPS, so only slow cold-start fixes were possible. This restores
# standard user-plane assistance.

# --- NTP time assistance (fixes mnld GET_RTC_FAIL; needs network) ---
NTP_SERVER=time.google.com

# --- SUPL (user-plane AGPS) ---
SUPL_HOST=supl.google.com
SUPL_PORT=7275
SUPL_VER=0x20000
SUPL_MODE=1
SUPL_ES=1

# --- XTRA / predicted ephemeris (faster TTFF) ---
XTRA_SERVER_1=https://agnss.goog/lto2.dat
XTRA_SERVER_2=https://download.googleapis.com/agnss/lto2.dat
XTRA_SERVER_3=https://download.googleapis.com/agnss/lto2.dat

# --- AGPS general ---
DEFAULT_AGPS_ENABLE=TRUE
DEFAULT_SSL_ENABLE=FALSE
DEFAULT_USER_PLANE=TRUE
REPORT_POSITION_USE_SUPL_REFLOC=1

# --- HAL behaviour ---
INTERMEDIATE_POS=0
ACCURACY_THRES=0
