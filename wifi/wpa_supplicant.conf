##### wpa_supplicant configuration file template - Meizu M6 (meizu_m6) #####
#
# Minimal MediaTek-combo template. The AOSP wpa_supplicant module in A13 no
# longer ships a `wpa_supplicant.conf` module of its own, so the device tree has
# to provide the file. MTK private driver commands come from
# lib_driver_cmd_mt66xx (BOARD_WPA_SUPPLICANT_PRIVATE_LIB in BoardConfig.mk),
# and the driver is switched on by writing 1 to /dev/wmtWifi
# (WIFI_DRIVER_STATE_CTRL_PARAM) - measured on unit REDACTED_UNIT 2026-08-03.
update_config=1
ctrl_interface=/data/vendor/wifi/wpa/sockets
driver_param=use_p2p_group_interface=1

device_name=Meizu M6
manufacturer=Meizu
model_name=meizu_m6
model_number=M711
serial_number=
device_type=10-0050F204-5
config_methods=physical_display virtual_push_button
p2p_no_group_iface=1
